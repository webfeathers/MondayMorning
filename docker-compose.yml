# Docker Compose for local development and testing
# Mirrors Railway production setup

version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: wf
      POSTGRES_PASSWORD: wf_dev_password
      POSTGRES_DB: wf_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wf"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Next.js Web Application
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://wf:wf_dev_password@postgres:5432/wf_platform
      AI_SERVICE_URL: http://ai-service:8000
      NEXTAUTH_SECRET: dev_secret_change_in_production_32chars
      NEXTAUTH_URL: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Background Worker
  worker:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.worker
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://wf:wf_dev_password@postgres:5432/wf_platform
      AI_SERVICE_URL: http://ai-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy

  # AI Service (FastAPI)
  ai-service:
    build:
      context: apps/ai-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: info
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:

networks:
  default:
    name: wf_network
