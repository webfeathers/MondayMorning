# Kubernetes Deployment for Worker Service
# Includes deployment, service, configmap, and horizontal pod autoscaler

apiVersion: v1
kind: ConfigMap
metadata:
  name: worker-config
  namespace: default
data:
  # Job Scheduler Configuration
  SCHEDULER_CHECK_INTERVAL: "60000"  # 1 minute

  # Stall Detection Configuration
  STALL_CHECK_INTERVAL: "60000"      # 1 minute
  JOB_STALL_TIMEOUT_MS: "900000"     # 15 minutes

  # Retry Engine Configuration
  RETRY_BASE_DELAY_MS: "5000"        # 5 seconds
  RETRY_MAX_DELAY_MS: "3600000"      # 1 hour
  RETRY_JITTER_MS: "1000"            # 1 second

  # Circuit Breaker Configuration
  CB_FAILURE_THRESHOLD: "5"          # failures before opening
  CB_SUCCESS_THRESHOLD: "2"          # successes to close
  CB_TIMEOUT_MS: "60000"             # 1 minute before half-open

  # Quota Manager Configuration
  QUOTA_WARNING_THRESHOLD: "0.25"    # 25%
  QUOTA_CRITICAL_THRESHOLD: "0.10"   # 10%

  # Node Configuration
  NODE_ENV: "production"
  PORT: "3001"

---
apiVersion: v1
kind: Secret
metadata:
  name: worker-secrets
  namespace: default
type: Opaque
stringData:
  # Database URL (use external secret manager in production!)
  DATABASE_URL: "postgresql://user:password@postgres:5432/workflow_prod"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: default
  labels:
    app: worker
    component: background-jobs
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
        component: background-jobs
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3001"
        prometheus.io/path: "/metrics"
    spec:
      # Use a service account with appropriate permissions
      serviceAccountName: worker

      # Anti-affinity to spread workers across nodes
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - worker
                topologyKey: kubernetes.io/hostname

      containers:
        - name: worker
          image: ghcr.io/your-org/worker:latest
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 3001
              protocol: TCP

          env:
            - name: WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: worker-secrets
                  key: DATABASE_URL

          envFrom:
            - configMapRef:
                name: worker-config

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          # Graceful shutdown
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 15"]

      # Termination grace period for graceful shutdown
      terminationGracePeriodSeconds: 45

---
apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: default
  labels:
    app: worker
spec:
  type: ClusterIP
  selector:
    app: worker
  ports:
    - name: http
      port: 3001
      targetPort: http
      protocol: TCP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: worker-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: worker
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker
  namespace: default
